name: build

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:

    - name: Check out code
      uses: actions/checkout@v4

    - name: Install linters and formatters
      run: |
        npm install eslint   --save-dev
        npm install prettier --save-dev

    - name: Install sass
      run: npm install sass --save-dev

    - name: Build
      run: make build-all
