name: cloudflare

on:
  workflow_dispatch:
  push:
    branches: [ "alpha" ]
  pull_request:
    branches: [ "alpha" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
    - name: Check out code
      uses: actions/checkout@v4

    - name: Install linters and formatters
      run: |
        npm install eslint   --save-dev
        npm install prettier --save-dev

    - name: Install sass
      run: npm install sass --save-dev

    - name: Release
      run: make release

    - name: Build cloudflare dist
      run: make cloudflare
