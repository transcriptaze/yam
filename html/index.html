<!DOCTYPE html>
<html class="metronome" data-theme="default">
  <head>
    <title>Yet Another Metronome</title>
    <link rel="icon"       href="/favicon.png" type="image/png" />
    <link rel="stylesheet" href="./css/YAM.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  </head>

  <body>
    <div class="content">
      <main>
        <div class="panel metronome">
          <yam-pads></yam-pads>
          <yam-info tabindex="-1" enterkeyhint="done" >
            <yam-progress slot="progress"></yam-progress>
          </yam-info>
        
          <div class="metrics">
            <yam-time-signature tabindex="-1" enterkeyhint="done"></yam-time-signature>
            <yam-mm             tabindex="-1" enterkeyhint="done" exportparts="BPM"></yam-mm>
          </div>

          <yam-loop tabindex="-1"></yam-loop>
          <yam-ding tabindex="-1" hidden></yam-ding>
        
          <div class="bpm">
            <yam-knob  tabindex="-1"></yam-knob>
            <yam-wheel tabindex="-1"></yam-wheel>
          </div>

          <yam-metronome tabindex="-1" autofocus></yam-metronome>
        </div>
        
        <div class="panel playlists hidden">
          <yam-playlists></yam-playlists>
          <yam-tracklist></yam-tracklist>
        </div>
        
        <div class="panel editor hidden">
          <yam-editor></yam-editor>
        </div>
      </main>

      <toolbar class="metronome">
        <div class="menu">
          <div class="left-menu">
            <button id="reset"><img src="./images/reset.svg"         draggable="false" /></button>
            <button id="metronome"><img src="./images/metronome.svg" draggable="false" /></button>
            <button id="playlist"><img src="./images/playlist.svg"   draggable="false" /></button>
            <button id="edit"><img src="./images/edit.svg"           draggable="false" /></button>
            <button id="load"><img src="./images/import.svg"         draggable="false" /></button>
            <button id="save"><img src="./images/export.svg"         draggable="false" /></button>
          </div>

          <div class="right-menu">
            <a id="settings" href="./settings.html" draggable="false">
              <img src="./images/settings.svg" draggable="false" />
            </a>
            <button id="fullscreen"><img src="./images/fullscreen.svg"       draggable="false" /></button>
            <button id="wakelock"  disabled><img src="./images/wakelock.svg" draggable="false" /></button>
            <button id="bug"       ><img src="./images/bug.svg"              draggable="false" /></button>
            <div id="about" class="about">
              <a href="./about.html" draggable="false">
                <img class="visible" src="./images/about.svg" draggable="false" />
              </a>
              <img id="oops" class="warning" src="./images/warning.svg" draggable="false" />
            </div>
          </div>
        </div>
      </toolbar>
    </div>

    <!-- file download/upload -->
    <a id="export" href="" style="display:none" download></a>
    <input id="picker" type="file" accept="application/x-yam, .yam" style="display:none;" />

    <!-- file import confirm -->
    <dialog class="import">
      <div>
        <p class="message">Load playlist from file ??</p>
        <button value="cancel">Cancel</button>
        <button value="ok">OK</button>
      </div>
    </dialog>

    <!-- TEMPLATES -->
    <template id="template-metronome">
      <div class="metronome">
        <button id="back" disabled><img src="./images/controls/skip-backwards.svg"  class="visible" draggable="false" /></button>
        <button id="play" disabled>
          <img src="./images/controls/play.svg" class="play"        draggable="false" />
          <img src="./images/controls/stop.svg" class="stop hidden" draggable="false" />
        </button>
        <button id="next" disabled><img src="./images/controls/skip-forwards.svg"   class="visible" draggable="false" /></button>
      </div>
    </template>

    <template id="template-pads">
      <div class="pads">
        <yam-beat class="beat block" beat="1"></yam-beat>
        <yam-beat class="beat block" beat="2"></yam-beat>
        <yam-beat class="beat block" beat="3"></yam-beat>
        <yam-beat class="beat block" beat="4"></yam-beat>
      </div>
    </template>

    <template id="template-beat">
      <div class="beat">
        <div class="shape"></div>
      </div>
    </template>

    <template id="template-time-signature">
      <div class="time-signature">
        <button popovertarget="list">
          <div>
            <img class="stave"         src="./images/time-signatures/stave.svg" />
            <img class="clef"          src="./images/time-signatures/clef.svg" />
            <img class="tactus"        src="./images/time-signatures/tactus/4.svg" />
            <img class="figura"        src="./images/time-signatures/figura/4.svg" />
            <img class="common hidden" src="./images/time-signatures/common.svg" />
            <img class="cut    hidden" src="./images/time-signatures/cut.svg" />
          </div>
        </button>

        <div id="list" popover>
          <div class="content">
            <ul>
              <li data-time-signature="common"><img src="./images/time-signatures/presets/common.svg" /></li>
              <li data-time-signature="cut"><img src="./images/time-signatures/presets/cut.svg" /></li>
              <li data-time-signature="2:2"><img src="./images/time-signatures/presets/2-2.svg" /></li>
              <li data-time-signature="2:4"><img src="./images/time-signatures/presets/2-4.svg" /></li>
              <li data-time-signature="3:4"><img src="./images/time-signatures/presets/3-4.svg" /></li>
              <li data-time-signature="4:4"><img src="./images/time-signatures/presets/4-4.svg" /></li>
              <li data-time-signature="6:8"><img src="./images/time-signatures/presets/6-8.svg" /></li>
              <li data-time-signature="12:8"><img src="./images/time-signatures/presets/12-8.svg" /></li>
            </ul>
            <div class="custom">
              <yam-tactus></yam-tactus>
              <yam-figura></yam-figura>
            </div>
          </div>
        </div>

        <div class="overlay"></div>
        <img id="lock" src="./images/lock.svg" />

        <datalist id="beats-list">
          <option value="1"></option>
          <option value="2"></option>
          <option value="3"></option>
          <option value="4"></option>
          <option value="5"></option>
          <option value="6"></option>
          <option value="7"></option>
          <option value="8"></option>
          <option value="9"></option>
          <option value="10"></option>
          <option value="11"></option>
          <option value="12"></option>
        </datalist>

        <datalist id="divisions-list">
          <option value="2"></option>
          <option value="4"></option>
          <option value="8"></option>
        </datalist>
      </div>
    </template>

    <template id="template-mm">
      <div class="MM">
        <button class="pulse" popovertarget="list">
          <img id="pulse" src="./images/MM/quarter-equals.svg"/>
        </button>
        <div id="list" popover>
          <div class="content">
            <div class="li" data-pulse="eighth"         ><img class="pulsus" src="./images/MM/popover/eighth.svg"         draggable="false" /></div>
            <div class="li" data-pulse="eighth-doublet" ><img class="pulsus" src="./images/MM/popover/eighth-doublet.svg" draggable="false" /></div>
            <div class="li" data-pulse="quarter"        ><img class="pulsus" src="./images/MM/popover/quarter.svg"        draggable="false" /></div>
            <div class="li" data-pulse="dotted-quarter" ><img class="pulsus" src="./images/MM/popover/dotted-quarter.svg" draggable="false" /></div>
            <div class="li" data-pulse="half"           ><img class="pulsus" src="./images/MM/popover/half.svg"           draggable="false" /></div>
            <div class="li" data-pulse="dotted-half"    ><img class="pulsus" src="./images/MM/popover/dotted-half.svg"    draggable="false" /></div>
          </div>
        </div>
        <div id="mirror">
          <span></span>
          <img id="lock" src="./images/lock.svg" />
        </div>
        <input part="BPM" type="text"  inputmode="numeric" value="120"
               pattern="[4-9][0-9]|1[0-9][0-9]|200" minlength="1" maxlength="3" 
               enterkeyhint="done" />
        <div class="overlay"></div>
      </div>
    </template>

    <template id="template-knob">
      <div class="knob">
        <input type="range" min="40" max="200" step="1" value="120" />
        <div class="background">
          <svg version="1.1" viewBox="0 0 100 100">
            <filter id="noise">
              <feTurbulence type="fractalNoise" baseFrequency="5" numOctaves="3" stitchTiles="stitch" />
            </filter>
            <rect width="100%" height="100%" filter="url(#noise)" />
          </svg>
        </div>
        <svg version="1.1" viewBox="-25 -25 50 50" overflow="visible" class="knob">
          <style>
            .small {
              font: 3px sans-serif;
            }
          </style>

          <defs>
            <radialGradient id="shadow" cx="0.5" cy="0.5" r="0.5">
              <stop offset="85%"  stop-color="#242a2e" opacity="0.4" />
              <stop offset="100%" stop-color="#242a2e" opacity="0" />
            </radialGradient>
            <linearGradient id="dial-base" x1="0" y1="0" x2="2.0" y2="1">
              <stop offset="0%"   stop-color="#52595f" />
              <stop offset="100%" stop-color="#2b3238" />
            </linearGradient>
            <linearGradient id="dial-highlight" x1="0" y1="0" x2="2.0" y2="1">
              <stop offset="0%"   stop-color="#70777d" opacity="1" />
              <stop offset="40%"  stop-color="#70777d" opacity="0" />
              <stop offset="55%"  stop-color="#70777d" opacity="0" />
              <stop offset="100%" stop-color="#70777d" opacity="0.3" />
            </linearGradient>
            <radialGradient id="clipping">
              <stop offset="0%"  stop-color="#ff0000ff" />
              <stop offset="25%" stop-color="#ff0000c0" />
              <stop offset="60%" stop-color="#ff000040" opacity="0%"/>
              <stop offset="90%" stop-color="#ff000000" opacity="0%"/>
            </radialGradient>
            <filter id="glow"  color-interpolation-filters="sRGB" x="-2" y="-2" width="5" height="5">
              <feGaussianBlur in="SourceGraphic" stdDeviation="2" />
            </filter>
            <line id="marker" x1="0" y1="0" x2="0" y2="-2.0" />
          </defs>

          <g transform="scale(1.2)">
            <circle class="indicator-focus" cx="0" cy="0" r="18" fill="#4eccff" filter="url(#glow)" visibility="hidden" />
            <circle class="bg"              cx="0" cy="0" r="18" fill="#353b3f" stroke="none" />
            <g>
              <circle  class="soft-shadow" cx="0" cy="0"  r="16"  fill="url(#shadow)" />
              <ellipse class="hard-shadow" cx="0" cy="2"  rx="14" ry="14.5" fill="#242a2e" opacity="0.15" />
              <circle  class="base"        cx="0" cy="0"  r="14"  fill="url(#dial-base)" stroke="#242a2e" stroke-width="1.5" />
              <circle  class="edge"        cx="0" cy="0"  r="13"  fill="transparent" stroke="url(#dial-highlight)" stroke-width="1.5" />
              <circle  class="highlight"   cx="0" cy="0"  r="14"  fill="#ffffff" opacity="0" />
              <circle  class="dot"         cx="0" cy="10" r="1.5" fill="#4eccff" style="transform:rotate(180deg);"/>
              <circle id="led" cx="0" cy="0"  r="15"   fill="url('#clipping')" opacity="0%" />
            </g>
            <circle class="indicator-bg" cx="0" cy="0" r="18" fill="none" stroke="#23292d" stroke-width="1" />
            <path   class="indicator"    d=""                 fill="none" stroke="#4eccff" stroke-width="1.5" />
            <path   class="red"          d=""                 fill="none" stroke="#ff0000" stroke-width="0.5" />
          </g>

          <g stroke="#222222" stroke-width="0.1" transform="scale(0.925)">
            <path d="M-6.470,24.148 a25,25,0,1,1,12.941,0 M-6.470,24.148" fill="none" />
              <use href="#marker" transform="rotate(-165)    translate(0,-25)" />
              <use href="#marker" transform="rotate(-123.75) translate(0,-25)" />
              <use href="#marker" transform="rotate(-82.5)   translate(0,-25)" />
              <use href="#marker" transform="rotate(-41.25)  translate(0,-25)" />
              <use href="#marker" transform="rotate(0)       translate(0,-25)" />
              <use href="#marker" transform="rotate(41.25)   translate(0,-25)" />
              <use href="#marker" transform="rotate(82.5)    translate(0,-25)" />
              <use href="#marker" transform="rotate(123.75)  translate(0,-25)" />
              <use href="#marker" transform="rotate(165)     translate(0,-25)" />

              <g class="small" stroke-width="0.1">
                <text x="0" y="0" text-anchor="middle" alignment-baseline="middle" transform="rotate(-165)    translate(0,-29) rotate(165)">40</text>
                <text x="0" y="0" text-anchor="middle" alignment-baseline="middle" transform="rotate(-123.75) translate(0,-29) rotate(123.75)">60</text>
                <text x="0" y="0" text-anchor="middle" alignment-baseline="middle" transform="rotate(-82.5)   translate(0,-29) rotate(82.5)">80</text>
                <text x="0" y="0" text-anchor="middle" alignment-baseline="middle" transform="rotate(-41.25)  translate(0,-29) rotate(41.25)">100</text>
                <text x="0" y="0" text-anchor="middle" alignment-baseline="middle" transform="rotate(0)       translate(0,-29) rotate(0)" font-weight="bold">120</text>
                <text x="0" y="0" text-anchor="middle" alignment-baseline="middle" transform="rotate(41.25)   translate(0,-29) rotate(-41.25)">140</text>
                <text x="0" y="0" text-anchor="middle" alignment-baseline="middle" transform="rotate(82.5)    translate(0,-29) rotate(-82.5)">160</text>
                <text x="0" y="0" text-anchor="middle" alignment-baseline="middle" transform="rotate(123.75)  translate(0,-29) rotate(-123.75)">180</text>
                <text x="0" y="0" text-anchor="middle" alignment-baseline="middle" transform="rotate(165)     translate(0,-29) rotate(-165)">200</text>
              </g>
          </g>

        </svg>
        <div class="overlay"></div>
      </div>
    </template>

    <template id="template-wheel">
      <div class="wheel">
        <input type="range" min="40" max="200" step="1" value="120" />
        <svg version="1.1" viewBox="-50 -18 100 36" overflow="visible">
          <style>
            .small {
              font: 5px sans-serif;
            }
          </style>

              <stop offset="0"   stop-color="#000000" />
              <stop offset="0.4" stop-color="#808080" />
              <stop offset="0.45"stop-color="#ffffff" />
              <stop offset="0.5" stop-color="#ffffff" />
              <stop offset="0.55"stop-color="#ffffff" />
              <stop offset="0.6" stop-color="#808080" />
              <stop offset="1"   stop-color="#000000" />
            </linearGradient>

            <clipPath id="clip-region">
              <rect x="-50" y="-18" width="100%" height="100%"/>
            </clipPath>

              <rect x="-50" y="-10" width="100%" height="100%" fill="url(#wheel)" />
            </mask>

            <rect id="knurl" x="-2" y="-8.5"  width="3" height="11" rx="2" stroke="none" fill="#808080" />
          </defs>

          </g>

              <text class="label" x="0" y="0" transform="translate( -52.9152758609,0) scale(0.4713967368,1)" data-angle="-61.875">150</text>
              <text class="label" x="0" y="0" transform="translate( -39.560748906, 0) scale(0.7518398075,1)" data-angle="-41.25">140</text>
              <text class="label" x="0" y="0" transform="translate( -21.1350028753,0) scale(0.9359059268,1)" data-angle="-20.625">130</text>
              <text class="label" x="0" y="0" transform="translate(0,0)               scale(1,           1)" data-angle="0">120</text>
              <text class="label" x="0" y="0" transform="translate( 21.1350028753,0)  scale(0.9359059268,1)" data-angle="20.625">110</text>
              <text class="label" x="0" y="0" transform="translate( 39.560748906, 0)  scale(0.7518398075,1)" data-angle="41.25">100</text>
              <text class="label" x="0" y="0" transform="translate( 52.9152758609,0)  scale(0.4713967368,1)" data-angle="61.875">90</text>
              <text class="label" x="0" y="0" transform="translate( 59.4866916824,0)  scale(0.1305261922,1)" data-angle="82.5">80</text>
              <text class="label" x="0" y="0" transform="translate( 61.5673812434,0)  scale(0.227076263,1)"  data-angle="103.125">70</text>
              <text class="label" x="0" y="0" transform="translate( 70.1118232618,0)  scale(0.555570233,1)"  data-angle="123.75">60</text>
              <text class="label" x="0" y="0" transform="translate( 85.0513381879,0)  scale(0.8128466846,1)" data-angle="144.375">50</text>
              <text class="label" x="0" y="0" transform="translate(104.4708572938,0)  scale(0.9659258263,1)" data-angle="165">40</text>

              <polygon points="-2.5,-6.5 0,-4.5, 2.5,-6.5" stroke="none" fill="#ffffff" />
            </g>

            <g id="knurls" clip-path="url(#clip-region)">
              <use href="#knurl" class="knurl" transform="translate(-60,           0) scale(0.1,1)"          data-angle="-90" />
              <use href="#knurl" class="knurl" transform="translate(-59.6713137221,0) scale(0.1045284633,1)" data-angle="-84" />
              <use href="#knurl" class="knurl" transform="translate(-58.6888560440,0) scale(0.2079116908,1)" data-angle="-78" />

              <use href="#knurl" class="knurl" transform="translate(59.6713137221,0) scale(0.1045284633,1)" data-angle="84" />
              <use href="#knurl" class="knurl" transform="translate(60,           0) scale(0.1,1)"          data-angle="90" />

            </g>

            <g id="ramp" clip-path="url(#clip-region)" stroke="none" fill="#4eccff">

  <!-- SCRIPTS -->
  <script type="module">
    import "./javascript/widgets/widgets.js"
    import { initialise, reset, show, load, save, requestWakeLock, toggleWakeLock, onError, showError, debug } from './javascript/YAM.js'

    const toolbar = {
      reset: document.querySelector('toolbar #reset'),
      metronome: document.querySelector('toolbar #metronome'),
      playlist: document.querySelector('toolbar #playlist'),
      edit: document.querySelector('toolbar #edit'),
      save: document.querySelector('toolbar #save'),
      load: document.querySelector('toolbar #load'),
      fullscreen : document.querySelector('toolbar #fullscreen'),
      wakelock: document.querySelector('toolbar #wakelock'),
      bug: document.querySelector('#bug'),
      oops: document.querySelector('#oops'),
    }

    // ... attach event handlers (because .. Safari)
    toolbar.reset.onclick = () => reset()
    toolbar.metronome.onclick = () => show('metronome')
    toolbar.playlist.onclick = () => show('playlist')
    toolbar.edit.onclick = () => show('editor')
    toolbar.save.onclick = () => save()
    toolbar.load.onclick = () => load()
    toolbar.wakelock.onclick = () => toggleWakeLock()
    toolbar.bug.onclick = () =>  debug()
    toolbar.oops.onclick = () => showError()

    toolbar.fullscreen.addEventListener('click', (event) => {
      if (document.fullscreenEnabled) {
         if (document.fullscreenElement == null) {
            document.body.requestFullscreen()
         } else {
            document.exitFullscreen()
         }
      }
    })

    document.addEventListener('contextmenu', (event) => {
      event.preventDefault()
    })

    document.addEventListener('fullscreenchange', (event) => {
      if (document.fullscreenElement) {
         document.body.classList.add('fullscreen')
      } else {
         document.body.classList.remove('fullscreen')
      }
    })

    // Android Chrome: set viewport height in CSS variable because the viewport height for a
    //                 PWA app loaded from the home page is incorrect
    window.addEventListener('load', () => {
      setTimeout(() => {
        const vh = window.visualViewport?.height || window.innerHeight

        document.documentElement.style.setProperty('--vh', `${vh}px`)
      }, 100)
    })

    window.onerror = (message, source, lineno, colno, error) => {
      onError({ message, source, lineno, colno, error })
      return true
    }

    window.addEventListener("unhandledrejection", (event) => {
      onError(event.reason)
      event.preventDefault()
    })

    // ... good to go!
    initialise()
    requestWakeLock()
  </script>
