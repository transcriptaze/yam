<!DOCTYPE html>
<html class="settings" data-theme="default">
  <head>
    <title>Yet Another Metronome - Settings</title>
    <link rel="icon"       href="./images/favicon.png" />
    <link rel="stylesheet" href="./css/YAM.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1.0, user-scalable=no">
    <script>
      (function() {
        try {
           const json = localStorage.getItem('YAM')
           const object = JSON.parse(json)
           const theme = object?.settings.theme ?? 'default'

           console.log({theme})

           document.documentElement.setAttribute('data-theme', theme);
        } catch (err) {
           console.log(err)
        }
       })()
    </script>    
  </head>

  <body>
    <div class="content">
      <main>
        <h1><div class="logo"></div>Yet Another Metronome</h1>
        <div class="settings">
          <label for="theme">Theme</label>
          <select id="theme">
            <option value="default">Default</option>
            <option value="dark">Dark</option>
          </select>

          <label for="soundset">Soundset</label>
          <select id="soundset">
            <option value="default">Default</option>
          </select>

          <label for="volume">Volume</label>
          <div class="volume">
            <input id="volume" type="range" min="-3" max="3" step="0.1" value="0"   list="markers" />
            <input             type="text"                              value="1.0" readonly />
            <datalist id="markers">
              <option value="-3"></option>
              <option value="-2"></option>
              <option value="-1"></option>
              <option value="0"></option>
              <option value="1"></option>
              <option value="2"></option>
              <option value="3"></option>
            </datalist>
          </div>

          <label for="click-track">Click track</label>
          <div id="click-track" class="click-track">
            <label for="fs">Sample rate</label>
            <input id="fs" type="number" min="0" value="48000" list="sample-rates" />
            <label for="preamble">Pre-amble</label>
            <input id="preamble" type="number" min="0" max="5" step="0.001" value="0.25" />
            <label for="postamble">Post-amble</label>
            <input id="postamble" type="number" min="0" max="5" step="0.001" value="0.25" />
            <label for="duration">Default duration</label>
            <input id="duration" type="number" min="0" max="900" step="1" value="300" />
            <label for="max">Max. duration</label>
            <input id="max" type="number" min="0" max="1800" step="1" value="600" />

            <datalist id="sample-rates">
              <option value="44100"></option>
              <option value="48000"></option>
            </datalist>

          </div>
        </div>
      </main>

      <toolbar class="settings">
        <div class="menu">
          <div class="left-menu">
            <button id="metronome" class="icon-metronome" aria-label="Metronome"></button>
            <button id="playlist"  class="icon-playlist"  aria-label="Playlist"></button>
          </div>
          <div class="right-menu">
            <button id="theme" class="icon-theme" aria-label="Theme"></button>
            <button id="about" class="icon-about" aria-label="About"></button>
          </div>
        </div>
      </toolbar>

    </div>
  </body>

  <!-- SCRIPTS -->
  <script type="module">
    import { initialise, onError } from './javascript/pages/settings.js'
    import { toggleTheme } from './javascript/YAM.js'

    const toolbar = {
      metronome: document.querySelector('toolbar #metronome'),
      playlist: document.querySelector('toolbar #playlist'),
      theme: document.querySelector('toolbar #theme'),
      about: document.querySelector('toolbar #about'),
    }

    toolbar.metronome.onclick = () => {
      window.location.href = './index.html'
    }
    
    toolbar.playlist.onclick = () => {
      window.location.href = './index.html#playlist'
    }

    toolbar.theme.onclick = () =>  toggleTheme()

    toolbar.about.onclick = () => {
      window.location.href = './about.html'
    }

    document.addEventListener('contextmenu', (event) => {
      event.preventDefault()
    })

    // Android Chrome: set viewport height in CSS variable because the viewport height for a
    //                 PWA app loaded from the home page is incorrect
    window.addEventListener('load', () => {
      setTimeout(() => {
        const vh = window.visualViewport?.height || window.innerHeight

        document.documentElement.style.setProperty('--vh', `${vh}px`)
      }, 100)
    })

    window.onerror = (message, source, lineno, colno, error) => {
      onError({ message, source, lineno, colno, error })
      return true
    }

    window.addEventListener("unhandledrejection", (event) => {
      onError(event.reason)
      event.preventDefault()
    })

    // ... good to go!
    initialise()

  </script>

</html>
