<!DOCTYPE html>
<html class="settings">
  <head>
    <title>Yet Another Metronome - Settings</title>
    <link rel="icon"       href="./images/favicon.png" />
    <link rel="stylesheet" href="./css/YAM.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1.0, user-scalable=no">
  </head>

  <body>
    <div class="content">
      <main>
        <h1><img src="./images/logo.png" />Settings</h1>
        <div class="settings">
          <label for="theme">Theme</label>
          <select id="theme">
            <option value="default">Default</option>
            <!-- <option value="light">Light</option> -->
            <!-- <option value="dark">Dark</option> -->
          </select>

          <label for="volume">Volume</label>
          <input id="volume" type="range" min="0" max="2.5" value="1.0" step="0.1" list="markers" />

          <datalist id="markers">
            <option value="0"></option>
            <option value="0.25"></option>
            <option value="0.50"></option>
            <option value="0.75"></option>
            <option value="1">1</option>
            <option value="1.25"></option>
            <option value="1.50"></option>
            <option value="1.75"></option>
            <option value="2">1</option>
            <option value="2.25"></option>
            <option value="2.50"></option>
          </datalist>
        </div>
      </main>

      <toolbar>
         <div class="menu">
           <div class="left-menu">
             <a href="./index.html#metronome">
                <img id="metronome" class="visible" src="./images/metronome.svg" draggable="false" />
             </a>
             <a href="./index.html#playlist">
               <img id="playlist" class="visible" src="./images/playlist.svg" draggable="false" />
             </a>
           </div>
           <div class="right-menu">
             <a href="./about.html">
               <img id="about" class="visible" src="./images/about.svg" draggable="false" />
             </a>
           </div>
         </div>
      </toolbar>
    </div>
  </body>

  <!-- SCRIPTS -->
  <script type="module">
  </script>

</html>
