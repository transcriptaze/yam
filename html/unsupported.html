<!DOCTYPE html>
<html class="unsupported" data-theme="default">
  <head>
    <title>Yet Another Metronome - WebAudio</title>
    <meta charset="utf-8" />
    <meta content="text/html;charset=utf-8" http-equiv="Content-Type" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="./css/YAM.css" />
    <script>
      (function() {
        try {
           const json = localStorage.getItem('YAM')
           const object = JSON.parse(json)
           const theme = object?.settings.theme ?? 'default'

           console.log({theme})

           document.documentElement.setAttribute('data-theme', theme);
        } catch (err) {
           console.log(err)
        }
       })()
    </script>    
  </head>

  <body>
    <div class="content">    
      <main class="unsupported">
        <h1><div class="logo"></div>Yet Another Metronome</h1>
        <div id="unsupported">
          <div>
            Unfortunately <em>Yet Another Metronome</em> requires the <b>WebAudio API</b> and this browser does not
            seem to have <em>WebAudio</em> enabled.
          </div>
          <div>
            The following browsers are known to work:
            <ul>
              <li><a href="https://www.google.com/chrome/index.html">Google Chrome</a></li>
              <li><a href="https://www.mozilla.org/firefox">Mozilla Firefox</a></li>
              <li><a href="https://www.apple.com/safari" >Apple Safari</a></li>
              <li><a href="https://www.opera.com">Opera</a></li>
            </ul>
          </div>
        </div>
      </main>
    </div>
  </body>

  <script type="module"></script>
</html>
